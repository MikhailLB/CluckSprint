name: cluck_sprint
description: "Cluck Sprint - endless chicken road crossing game."
publish_to: 'none'

# version: <semver>+<build>  → versionName + versionCode (single source of truth)
version: 1.0.1+4

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # --- Networking & state ---
  http: ^1.4.0
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^10.0.0
  connectivity_plus: ^6.1.3
  url_launcher: ^6.3.2

  # --- WebView (gray shell) ---
  webview_flutter: ^4.13.0
  webview_flutter_android: ^4.10.0

  # --- Attribution & backend ---
  appsflyer_sdk: ^6.16.0

  # --- Firebase stack ---
  firebase_core: ^3.14.0
  firebase_messaging: ^15.2.6
  firebase_app_check: ^0.3.2+10
  flutter_local_notifications: ^18.0.1

  # --- Device probing ---
  device_info_plus: ^11.4.0
  package_info_plus: ^8.3.1

  # IMPORTANT: never bump to 9.x/10.x — that release moved to Kotlin-only
  # and clashes with Flutter's built-in Kotlin support, breaking the
  # GeneratedPluginRegistrant on Android. Keep on 8.x.
  file_picker: 8.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: false
  # Legacy launcher (pre-Oreo / non-adaptive): full art, fills the
  # whole canvas. May still be cropped to a circle but that's OK on
  # devices that don't use adaptive masks.
  image_path: "assets/iconnn.png"
  # Adaptive icon: foreground is the art pre-padded so it fits inside
  # the Android safe zone regardless of the launcher mask shape (circle,
  # squircle, teardrop, etc.) — nothing gets clipped off the chicken.
  adaptive_icon_foreground: "assets/icon_adaptive_fg.png"
  adaptive_icon_background: "assets/icon_adaptive_bg.png"
  min_sdk_android: 21
  remove_alpha_ios: true

flutter:
  uses-material-design: true

  assets:
    - assets/chikengame.webp
    - assets/chikenmenu.webp
    - assets/carred.webp
    - assets/yellowcar.webp
    - assets/bluecar.webp
    - assets/road.webp
    - assets/grass.webp
    - assets/grawee.webp
    - assets/logo-2.webp
    - assets/Vertical_LoadingScreen.webp
    - assets/Horizontal_LoadingScreen.webp
    - assets/iconnn.png
    - assets/Notifications/Vertical_Notifications_Screen.webp
    - assets/Notifications/Horizontal_Notifications_Screen.webp
    - assets/Nowifi/Vertical_Nowifi_Screen.webp
    - assets/Nowifi/Horizontal_Nowifi_Screen.webp
